<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADX Health Authorization Demo</title><link rel="stylesheet" href="src/styles.css"></head>
<body><main id="app"></main><script>
const state={notice:'',selected:'PA-20481',create:false,cases:[
{id:'PA-20481',member:'Avery K. · DEMO',service:'MRI, lower extremity',provider:'Northlake Orthopedics',status:'HUMAN',risk:'Elevated',due:'Today, 3:30 PM',score:92,note:'Coverage criteria and submitted clinical notes are complete. A licensed reviewer must make the determination.',events:[['09:12','Provider portal','Prior-authorization request submitted','a91f…74c2'],['09:13','Eligibility service','Active coverage and benefit verified','d117…8bb4'],['09:16','Evidence service','Clinical documentation completeness verified','04a8…e091'],['09:17','ADX policy','Escalated: licensed reviewer required','bc21…56fe']]},
{id:'PA-20478',member:'Jordan M. · DEMO',service:'Physical therapy, 8 visits',provider:'Riverbend Rehab',status:'REVIEW',risk:'Standard',due:'Today, 5:00 PM',score:84,note:'Intake is complete. ADX is assembling a structured evidence packet for reviewer consideration.',events:[]},
{id:'PA-20470',member:'Sam R. · DEMO',service:'Specialty medication continuation',provider:'Harbor Specialty',status:'APPROVED',risk:'High',due:'Completed',score:97,note:'Demonstration record only. The recorded determination is available with its evidence trail.',events:[]}
]};
const labels={INTAKE:'Intake',REVIEW:'Evidence review',HUMAN:'Human review',APPROVED:'Determination recorded',DENIED:'Determination recorded'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dig=s=>s.slice(0,4).padEnd(4,'0')+'…'+Math.abs([...s].reduce((n,c)=>n*31+c.charCodeAt(0),7)).toString(16).slice(0,4);
function action(status,label,actor='Licensed reviewer'){const c=current();c.status=status;c.events.push([new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),actor,label,dig(c.id+status+Date.now())]);state.notice=c.id+': '+label;render()}
function current(){return state.cases.find(c=>c.id===state.selected)}
function badge(c){return `<span class="pill ${c.status==='HUMAN'?'pending_human_review':c.status==='REVIEW'?'clinical_review':c.status.toLowerCase()}">${labels[c.status]}</span>`}
function actions(c){if(c.status==='INTAKE')return `<button class="primary full" onclick="action('REVIEW','Eligibility verification requested','ADX workflow')">Start governed intake</button>`;if(c.status==='REVIEW')return `<button class="primary full" onclick="action('HUMAN','Evidence packet sealed; human review required','ADX evidence service')">Seal evidence packet</button>`;if(c.status==='HUMAN')return `<button class="primary full" onclick="action('APPROVED','Coverage determination recorded: approved')">Record approval</button><button class="secondary full" onclick="action('DENIED','Coverage determination recorded: denied')">Record denial</button>`;return `<button class="secondary full" onclick="state.notice='The outcome record, evidence digests, and reviewer attestation are preserved in the ledger.';render()">View outcome record</button>`}
function lifecycle(c){let n=c.status==='DENIED'?3:['INTAKE','REVIEW','HUMAN','APPROVED'].indexOf(c.status);return `<section class="lifecycle">${['Intake','Evidence review','Human decision','Outcome'].map((s,i)=>`<div class="${i<=n?'done':''}"><span>${i<n?'✓':i+1}</span><strong>${s}</strong></div>`).join('')}</section>`}
function render(){const c=current(),open=state.cases.filter(x=>!['APPROVED','DENIED'].includes(x.status)).length,done=state.cases.length-open;document.querySelector('#app').innerHTML=`
<aside class="sidebar"><div class="brand"><span class="brand-mark">A</span><div><strong>ADX</strong><small>Health operations demo</small></div></div><nav><a class="active">Authorization workbench</a><a>Evidence ledger</a><a>Policy controls</a><a>Release health</a></nav><div class="sidebar-note"><span>●</span> Demonstration mode<br><small>No protected health information. No clinical or coverage decision is automated.</small></div></aside>
<section class="shell"><header><div><p class="eyebrow">HEALTH INSURANCE · PRIOR AUTHORIZATION</p><h1>A decision workflow people can trust.</h1><p class="lede">ADX organizes evidence, enforces policy gates, and preserves a verifiable record. Licensed humans make determinations.</p></div><button class="primary" onclick="state.create=true;render()">+ New request</button></header>${state.notice?`<div class="notice">✓ ${esc(state.notice)}<button onclick="state.notice='';render()">Dismiss</button></div>`:''}
<section class="metrics"><div class="metric blue"><strong>${open}</strong><span>Open requests</span></div><div class="metric green"><strong>100%</strong><span>Evidence-bound gates</span></div><div class="metric purple"><strong>${done}</strong><span>Recorded outcomes</span></div><div class="metric gold"><strong>0</strong><span>Automated determinations</span></div></section>
<div class="workbench"><section class="case-list card"><div class="section-heading"><div><p class="eyebrow">QUEUE</p><h2>Authorization cases</h2></div><span class="count">${state.cases.length}</span></div><div class="case-items">${state.cases.map(x=>`<button class="case-item ${x.id===c.id?'selected':''}" onclick="state.selected='${x.id}';render()"><div><strong>${x.id}</strong><span>${x.member}</span></div>${badge(x)}<p>${x.service}</p><small>${x.due}</small></button>`).join('')}</div></section>
<section class="detail"><div class="case-hero card"><div><p class="eyebrow">${c.id} · ${c.risk} review</p><h2>${c.service}</h2><p>${c.member} · ${c.provider}</p></div>${badge(c)}</div>${lifecycle(c)}<div class="two-col"><section class="card evidence"><p class="eyebrow">EVIDENCE SUMMARY</p><h2>Reviewer-ready, not decision-making</h2><p>${c.note}</p><div class="confidence"><div><span>Evidence completeness</span><strong>${c.score}%</strong></div><div class="bar"><i style="width:${c.score}%"></i></div></div><div class="evidence-grid"><div><span>Coverage eligibility</span><strong>Verified</strong></div><div><span>Clinical records</span><strong>${c.score?'Complete':'Awaiting intake'}</strong></div><div><span>Policy version</span><strong>PA-2026.08</strong></div><div><span>Decision authority</span><strong>Licensed reviewer</strong></div></div></section><section class="card actions"><p class="eyebrow">GOVERNED ACTIONS</p><h2>What can happen now</h2><p>Every action checks role, policy version, evidence freshness, and a tamper-evident ledger.</p>${actions(c)}<small class="action-note">Human authority is required for a determination.</small></section></div>
<section class="card ledger"><div class="section-heading"><div><p class="eyebrow">TAMPER-EVIDENT LEDGER</p><h2>Case activity</h2></div><span class="integrity">● Integrity verified</span></div>${c.events.length?`<ol>${c.events.map(e=>`<li><time>${e[0]}</time><span class="event-dot"></span><div><strong>${e[2]}</strong><p>${e[1]} · <code>${e[3]}</code></p></div></li>`).join('')}</ol>`:`<div class="empty">No activity recorded yet. Start governed intake to create the first auditable event.</div>`}</section></section></div></section>
${state.create?`<div class="modal-backdrop"><form class="modal" onsubmit="create(event)"><div class="section-heading"><div><p class="eyebrow">DEMONSTRATION INTAKE</p><h2>Create a request</h2></div><button type="button" class="icon-button" onclick="state.create=false;render()">×</button></div><p>Use fictional data only. This demonstration does not issue health-insurance determinations.</p><label>Member display name<input name="member" required placeholder="Taylor S."></label><label>Requested service<input name="service" required placeholder="e.g., MRI, lower extremity"></label><label>Requesting provider<input name="provider" required placeholder="e.g., Northlake Orthopedics"></label><div class="modal-actions"><button type="button" class="secondary" onclick="state.create=false;render()">Cancel</button><button class="primary">Create governed request</button></div></form></div>`:''}`}
function create(e){e.preventDefault();let d=new FormData(e.target),c={id:'PA-'+(20482+state.cases.length),member:d.get('member')+' · DEMO',service:d.get('service'),provider:d.get('provider'),status:'INTAKE',risk:'Standard',due:'Next business day',score:0,note:'Request created. It awaits eligibility verification and evidence intake.',events:[['Now','Intake coordinator','Prior-authorization request created',dig(d.get('service')+d.get('provider'))]]};state.cases.unshift(c);state.selected=c.id;state.create=false;state.notice=c.id+' created and queued for governed intake.';render()}
render();
</script></body></html>

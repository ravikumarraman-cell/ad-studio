services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adx
      POSTGRES_USER: adx
      POSTGRES_PASSWORD: adx_local_only
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adx -d adx"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: adx-local
      MINIO_ROOT_PASSWORD: adx-local-change-before-shared
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

name: Stage 0 gate
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: adx
          POSTGRES_USER: adx
          POSTGRES_PASSWORD: adx_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adx -d adx"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://adx:adx_local_only@127.0.0.1:5432/adx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.19.0, cache: npm }
      - run: npm ci --legacy-peer-deps
      - run: npm run verify:stage0
      - run: npm run verify:feature-import
      - run: npm run typecheck
      - run: npm --workspace=@adx/tanstack-start-canary run build
      - run: npm run canary:smoke
      - run: npm run api:smoke
      - run: npm run verify:stage1
      - run: npm run migrate:stage2
      - run: npm run verify:stage2
      - run: npm run verify:stage2:postgres
      - run: npm run verify:stage2:api
      - run: npm run verify:stage3
      - run: npm run verify:stage3:api
      # The API's authorization and Stage 2 gates are Playwright browser tests.
      # Install the lockfile-pinned Chromium before either one runs.
      - run: npx playwright install --with-deps chromium
      - run: npm --workspace=@adx/api run test:browser:stage2
      - run: npm --workspace=@adx/api run test:browser:stage3
      - run: npm --workspace=@adx/api run test:browser
      - run: npm --workspace=adx-health-authorization-demo run build
      - run: npm --workspace=adx-health-authorization-demo run test:browser

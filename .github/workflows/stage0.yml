name: Stage 0 gate
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.19.0, cache: npm }
      - run: npm ci --legacy-peer-deps
      - run: npm run verify:stage0
      - run: npm run verify:feature-import
      - run: npm run typecheck
      - run: npm --workspace=@adx/tanstack-start-canary run build
      - run: npm run canary:smoke
      - run: npm run api:smoke
      - run: npm --workspace=adx-health-authorization-demo run build
      - run: npx playwright install --with-deps chromium
      - run: npm --workspace=adx-health-authorization-demo run test:browser
